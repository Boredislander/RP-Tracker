services:
  apex-tracker:
    image: apex-tracker
    container_name: apex-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - TRN_API_KEY=${TRN_API_KEY}
    networks:
      - shared

networks:
  shared:
    external: true
